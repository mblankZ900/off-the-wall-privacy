<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#12000e">
  <meta name="description" content="Datenschutzerklärung und Privacy Policy der Android-App Off The Wall.">
  <title>Datenschutz · Off The Wall</title>
  <style>
    :root {
      --background: #12000e;
      --surface: #251020;
      --surface-soft: #32102a;
      --text: #fff7fc;
      --muted: #d7bdce;
      --accent: #ff1493;
      --accent-soft: #ff7bb8;
      --border: rgba(255, 255, 255, 0.14);
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.32);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 82% 4%, rgba(255, 20, 147, 0.12), transparent 28rem),
        radial-gradient(circle at 5% 44%, rgba(110, 20, 86, 0.18), transparent 30rem),
        var(--background);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.65;
    }

    a { color: var(--accent-soft); }
    a:hover { color: white; }

    .page {
      width: min(920px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 72px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 10px 2px 32px;
    }

    .brand {
      color: var(--text);
      font-size: clamp(1rem, 4vw, 1.25rem);
      font-weight: 900;
      letter-spacing: 0.02em;
      text-decoration: none;
    }

    .brand span { color: var(--accent); }

    .language-switch {
      display: inline-flex;
      gap: 4px;
      padding: 4px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: rgba(37, 16, 32, 0.82);
    }

    .language-switch button {
      min-width: 48px;
      padding: 8px 12px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-weight: 750;
      cursor: pointer;
    }

    .language-switch button[aria-pressed="true"] {
      background: var(--accent);
      color: white;
    }

    main {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 28px;
      background: rgba(37, 16, 32, 0.92);
      box-shadow: var(--shadow);
    }

    .hero {
      padding: clamp(28px, 7vw, 64px);
      border-bottom: 1px solid var(--border);
      background: linear-gradient(145deg, rgba(110, 20, 86, 0.48), rgba(37, 16, 32, 0.42));
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--accent-soft);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 720px;
      margin: 0;
      font-size: clamp(2.15rem, 8vw, 4.5rem);
      line-height: 1.02;
      letter-spacing: -0.055em;
    }

    .intro {
      max-width: 700px;
      margin: 22px 0 0;
      color: var(--muted);
      font-size: clamp(1rem, 2.2vw, 1.14rem);
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 30px;
    }

    .summary div {
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: rgba(18, 0, 14, 0.45);
      color: var(--muted);
      font-size: 0.9rem;
    }

    .summary strong {
      display: block;
      margin-bottom: 3px;
      color: white;
      font-size: 1rem;
    }

    .content { padding: clamp(28px, 7vw, 64px); }

    section + section {
      margin-top: 42px;
      padding-top: 42px;
      border-top: 1px solid var(--border);
    }
